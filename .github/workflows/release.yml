# Publishes a Foundry-installable release. Two ways in, one job.
#
# **From the Actions tab.** Run this workflow, type a version, and it stamps that
# version into module.json, commits, tags, packs and publishes. Nothing to do
# locally.
#
# **From your terminal.** Push a tag that matches the version already in
# module.json, which is what the ship script writes:
#
#     git tag v0.1.0
#     git push origin v0.1.0
#
# The repo carries the built module, so nothing compiles here. The job packs the
# four shipped paths into a zip Foundry can install and attaches it beside the
# manifest.
#
# A version carrying a suffix (0.2.0-beta.1) publishes as a pre-release, and its
# manifest URLs point at that tag rather than /latest/, so a GM testing it does
# not get pulled onto the next stable build.

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, as x.y.z or x.y.z-beta.1'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
        with:
          # The dispatch path commits the version bump, so it needs the branch
          # rather than the detached tag a push checks out.
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref_name || github.ref }}
          fetch-depth: 0

      - name: Settle the version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            # Tolerate "v1.2.3" and "Release v1.2.3" in the input box.
            VERSION="${INPUT_VERSION#Release }"
            VERSION="${VERSION#v}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi

          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "Version must read x.y.z or x.y.z-suffix. Read: $VERSION"
            exit 1
          fi

          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists. Pick the next version."
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          case "$VERSION" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *)   echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Check the shipped paths are all present
        run: |
          for path in module.json dist/module.js styles/gauntlet.css assets; do
            if [ ! -e "$path" ]; then
              echo "Missing $path. The release would install broken."
              exit 1
            fi
          done

      - name: Check module.json against the tag
        if: github.event_name == 'push'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          MANIFEST=$(jq -r .version module.json)
          if [ "$VERSION" != "$MANIFEST" ]; then
            echo "Tag v$VERSION disagrees with module.json version $MANIFEST."
            echo "Re-run the ship script with --version $VERSION, commit, then tag again."
            exit 1
          fi

      - name: Stamp the version, commit and tag
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          jq --arg v "$VERSION" '.version = $v' module.json > module.tmp.json
          mv module.tmp.json module.json

          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          if ! git diff --quiet module.json; then
            git commit -q -m "chore: release $VERSION" module.json
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

          git tag -a "v$VERSION" -m "The Gauntlet $VERSION"
          git push origin "v$VERSION"

      - name: Pin the manifest URLs for a pre-release
        if: steps.version.outputs.prerelease == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          BASE="https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION"
          jq --arg m "$BASE/module.json" --arg d "$BASE/the-gauntlet.zip" \
            '.manifest = $m | .download = $d' module.json > module.tmp.json
          mv module.tmp.json module.json

      - name: Pack the module
        run: |
          zip -r -q the-gauntlet.zip module.json dist styles assets
          echo "Packed $(du -h the-gauntlet.zip | cut -f1) from $(unzip -l the-gauntlet.zip | tail -n 1)"

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: The Gauntlet ${{ steps.version.outputs.version }}
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: |
            module.json
            the-gauntlet.zip

      - name: Say where it landed
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          echo "Install URL for Foundry:"
          if [ "${{ steps.version.outputs.prerelease }}" = "true" ]; then
            echo "  https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION/module.json"
          else
            echo "  https://github.com/$GITHUB_REPOSITORY/releases/latest/download/module.json"
          fi
